name: Build Windows Executable

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 pyperclip supabase pyinstaller pillow

    - name: Convert Icon
      run: |
        python -c "from PIL import Image; Image.open('icon.png').save('icon.ico')"

    - name: Build Executable with PyInstaller
      run: |
        pyinstaller --onefile --noconsole --icon=icon.ico --name "clipBQ" app.py

    - name: Upload Windows Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Windows-clipBQ-Executable
        path: dist/clipBQ.exe