name: Build Windows Executable

on:
  push:
    branches: [ main, master ]  
  workflow_dispatch:      

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        clean: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 pyinstaller
        pip install -r requirements.txt

    - name: Create .env file
      run: |
        echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
        echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
        echo "LOGIN_PAGE_URL=${{ secrets.LOGIN_PAGE_URL }}" >> .env
      shell: bash

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --noconsole --name="clipBQ" --collect-all PyQt6 --windowed --clean \
        --add-data ".env;." \
        --add-data "icon.ico;." \
        --icon=icon.ico main.py

    - name: Upload Finished EXE
      uses: actions/upload-artifact@v4
      with:
        name: clipBQ-windows-app
        path: dist/clipBQ.exe
        overwrite: true